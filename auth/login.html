<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NBA Stat Poker — Sign In</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  .auth-wrap{
    width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .auth-card{
    width:min(90vw, 340px);
    padding:28px 26px 26px;
    display:flex; flex-direction:column; align-items:stretch; gap:14px;
  }
  .auth-title{
    font-family:var(--font-display); font-stretch:condensed; font-weight:800;
    text-transform:uppercase; letter-spacing:.03em; font-size:1.3em;
    text-align:center; margin:0;
  }
  .auth-tabs{ display:flex; gap:8px; }
  .auth-tab{
    flex:1; text-align:center; padding:8px; border-radius:10px; cursor:pointer;
    font-family:var(--font-display); font-stretch:condensed; font-weight:800;
    letter-spacing:.03em; text-transform:uppercase; font-size:.85em;
    border:1.5px solid rgba(0,0,0,.35); background:rgba(0,0,0,.06); color:var(--ink);
  }
  .auth-tab.active{ background:var(--gold); }
  .auth-field{ display:flex; flex-direction:column; gap:4px; }
  .auth-field label{
    font-size:.78em; font-weight:700; color:var(--ink); opacity:.75;
    text-transform:uppercase; letter-spacing:.04em;
  }
  .auth-field input{
    font-family:var(--font-body); font-size:1em; padding:10px 12px;
    border-radius:8px; border:1.5px solid rgba(0,0,0,.3); background:#fff; color:var(--ink);
  }
  .auth-error{
    color:#832e26; font-size:.85em; font-weight:600; text-align:center; min-height:1.2em;
  }
  .auth-hint{ color:var(--ink); opacity:.6; font-size:.75em; text-align:center; }
  .auth-status{ color:var(--ink); text-align:center; }
  .auth-divider{
    display:flex; align-items:center; gap:10px; color:var(--ink); opacity:.5;
    font-size:.78em; text-transform:uppercase; letter-spacing:.04em;
  }
  .auth-divider::before, .auth-divider::after{ content:''; flex:1; height:1px; background:rgba(0,0,0,.2); }
  #googleSignInDiv{ display:flex; justify-content:center; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div id="app"></div>
</div>
<script type="module" src="login.js"></script>
</body>
</html>
