# fly.toml app configuration file generated for nbastatpoker on 2026-08-11T15:20:28-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nbastatpoker'
primary_region = 'ord'

[build]
[http_service]
  internal_port = 5500
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "nba_poker_data"
  destination = "/app/server/data"
